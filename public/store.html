<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <title>Checklist de tienda</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="store-app">
    <header class="store-head">
      <div>
        <h1 id="store-name">Cargando…</h1>
        <p id="store-date"></p>
      </div>
      <div class="who">
        <span id="who-name"></span>
        <button class="btn ghost small" id="logout">Salir</button>
      </div>
    </header>

    <div id="error" class="error-banner" hidden></div>
    <div id="not-store" class="card" style="padding:18px" hidden>
      <p style="margin:0 0 12px">Esta pantalla es para el personal de una tienda. Tu usuario administra el panel.</p>
      <a class="btn" href="/">Ir al panel</a>
    </div>

    <div id="app" hidden>
      <div id="approval-banner"></div>

      <section class="card presence-bar">
        <div>
          <strong id="presence-title">Entrada a la tienda</strong>
          <div class="small muted" id="presence-sub"></div>
        </div>
        <div class="controls">
          <button class="btn" id="btn-in">Entrar</button>
          <button class="btn ghost" id="btn-out">Salir</button>
        </div>
        <div class="roster" id="roster" style="width:100%"></div>
        <div id="entry-photo-box" style="width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center" hidden></div>
      </section>

      <nav class="tabs" id="tabs" aria-label="Momento del día"></nav>
      <section class="card summary" id="summary"></section>
      <div class="checklist" id="checklist"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
  <script src="/store.js"></script>
</body>
</html>
